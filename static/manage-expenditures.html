{% extends 'base.html' %} {% block content %}
<h1 style="text-align: center">Submit an expenditure</h1>
<hr />
<div class="row">
  <div class="col-md-4 offset-md-4">
    <form action="/home/expenditures/manage" method="POST">
      <div class="form-group">
        <label for="value">name:</label>
        <input
          type="text"
          id="name"
          class="form-control"
          name="name"
          placeholder="rent, tomatos, shampoo....."
          required
        />
      </div>
      <div class="form-group">
        <label for="value">value:</label>
        <input
          type="number"
          id="value"
          class="form-control"
          name="value"
          placeholder="9.38"
          step="0.01"
          min="0"
          max="10000"
          required
        />
      </div>
      <div class="form-group">
        <label for="frequency">type:</label>
        <select class="form-control" id="expenditure" name="type" required>
          <option value="expense">expense</option>
          <option value="deposit">deposit</option>
        </select>
      </div>
      <div class="form-group">
        <label for="frequency">frequency:</label>
        <select class="form-control" id="frequency" name="frequency" required>
          <option value="one-off">one off</option>
          <option value="daily">daily</option>
          <option value="weekly">weekly</option>
          <option value="monthly">monthly</option>
        </select>
      </div>
      <div class="form-group">
        <label for="interval"
          >happens every n of frequency (not valid for one off):</label
        >
        <input
          type="number"
          id="interval"
          class="form-control"
          name="interval"
        />
      </div>
      <div class="form-group">
        <label for="start_date">start date</label>
        <input
          type="date"
          id="start_date"
          class="form-control"
          name="start_date"
          required
        />
      </div>
      <div class="form-group">
        <label for="end_date"
          >end date (leave empty for one off, or for no end)</label
        >
        <input type="date" id="end_date" class="form-control" name="end_date" />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
