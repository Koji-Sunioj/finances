{% extends 'base.html' %} {% block content %}
<h1 style="text-align: center">Submit Monthly expenditure</h1>
<hr />
<div class="row">
  <div class="col-md-4 offset-md-4">
    <form action="/home/expenditures/monthly" method="POST">
      <div class="form-group">
        <label for="value">name:</label>
        <input
          type="text"
          id="name"
          class="form-control"
          name="name"
          placeholder="rent, tomatos, shampoo....."
          required
        />
      </div>
      <div class="form-group">
        <label for="value">value:</label>
        <input
          type="number"
          id="value"
          class="form-control"
          name="value"
          placeholder="9.38"
          step="0.01"
          min="0"
          max="10000"
          required
        />
      </div>
      <div class="form-group">
        <label for="frequency">type:</label>
        <select class="form-control" id="expenditure" name="type" required>
          <option value="expense">expense</option>
          <option value="deposit">deposit</option>
        </select>
      </div>
      <div class="form-group">
        <label for="monthly_days"
          >days of the months (day is skipped if doesn't exist in month):</label
        >
        <select
          class="form-control"
          id="monthly_days"
          name="monthly_days"
          required
          multiple
        >
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="19">19</option>
          <option value="20">20</option>
          <option value="21">21</option>
          <option value="22">22</option>
          <option value="23">23</option>
          <option value="24">24</option>
          <option value="25">25</option>
          <option value="26">26</option>
          <option value="27">27</option>
          <option value="28">28</option>
          <option value="29">29</option>
          <option value="30">30</option>
          <option value="31">31</option>
        </select>
      </div>
      <div class="form-group">
        <label for="skip">skips every n months:</label>
        <input type="number" id="skip" class="form-control" name="skip" />
      </div>
      <div class="form-group">
        <label for="start_date">start date</label>
        <input
          type="date"
          id="start_date"
          class="form-control"
          name="start_date"
          min="{{ request.state.max_date }}"
          required
        />
      </div>
      <div class="form-group">
        <label for="end_date">end date (leave empty for no end)</label>
        <input
          type="date"
          id="end_date"
          class="form-control"
          name="end_date"
          min="{{ request.state.max_date }}"
        />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
