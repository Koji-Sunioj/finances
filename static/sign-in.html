{% extends 'base.html' %} {% block content %}
<h1>Sign in to the 💵Finances App💵 to track and predict your expenses</h1>
<hr />
<div class="row">
  <div class="col-md-4 offset-md-4 border rounded-1">
    <form action="/home" method="POST">
      <div class="form-group">
        <label for="username">username:</label>
        <input
          type="text"
          class="form-control"
          placeholder="User name"
          name="username"
          id="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">password:</label>
        <input
          type="password"
          class="form-control"
          placeholder="Password"
          name="password"
          id="password"
          required
        />
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" name="new-account" />
        <label class="form-check-label" for="exampleCheck1">New account</label>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    {% if alert == "unauthorized" %}
    <div class="alert alert-danger mt-2" role="alert">
      invalid credentials for username {{ username }} 🙅
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
