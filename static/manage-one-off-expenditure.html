{% extends 'base.html' %} {% block content %} {% if expenditure_id %}
<h1 style="text-align: center">
  Edit One-time expenditure {{ expenditure_id }}
</h1>
{% else %}
<h1 style="text-align: center">Submit One-time expenditure</h1>
{% endif %} {% set expenditure_types = ["expense","deposit"] %}
<hr />
<div class="row">
  <div class="col-md-4 offset-md-4 border rounded-1">
    <form
      action="/home/expenditures/one-off/{{ expenditure_id }}"
      method="POST"
    >
      <div class="form-group">
        <label for="value">name:</label>
        <input
          type="text"
          id="name"
          class="form-control"
          name="name"
          placeholder="rent, tomatos, shampoo....."
          value="{{ name }}"
          required
        />
      </div>
      <div class="form-group">
        <label for="value">value:</label>
        <input
          type="number"
          id="value"
          class="form-control"
          name="value"
          placeholder="9.38"
          step="0.01"
          min="0"
          max="10000"
          value="{{ value }}"
          required
        />
      </div>
      <div class="form-group">
        <label for="frequency">type:</label>
        <select class="form-control" id="expenditure" name="type" required>
          {% for expenditure in expenditure_types %} {% if expenditure == type
          %}
          <option value="{{ expenditure }}" selected>{{ expenditure }}</option>
          {% else %}
          <option value="{{ expenditure }}">{{ expenditure }}</option>
          {% endif %} {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="occur_date">occurence date</label>
        <input
          type="date"
          id="occur_date"
          class="form-control"
          name="occur_date"
          min="{{ request.state.max_date }}"
          value="{{ occur_date }}"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    {% if expenditure_id %}
    <form
      action="/home/expenditures/one-off/{{expenditure_id}}/delete"
      method="POST"
    >
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
