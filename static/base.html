<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="/static/app.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-light bg-light ml-2">
        {% if request.state.breadcrumbs %} {% for breadcrumb in
        request.state.breadcrumbs %}
        <span
          >&nbsp;/&nbsp;<a href="{{ breadcrumb.url }}"
            >{{ breadcrumb.name }}</a
          ></span
        >
        {% endfor %} {% else %}
        <span>&nbsp;</span>
        {% endif %}
      </nav>
      <div class="pt-2">{% block content %} {% endblock %}</div>
    </div>
  </body>
</html>
